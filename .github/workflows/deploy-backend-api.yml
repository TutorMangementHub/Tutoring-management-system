name: Deploy Node.js API to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  VPS_APP_PATH: /home/mo/Tutoring-management-system

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: backend
        run: |
          node --check src/index.js
          node --check src/server.js
          node --check ecosystem.config.cjs

      - name: Run tests
        working-directory: backend
        run: npm test

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            cd "${{ env.VPS_APP_PATH }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            cd backend
            test -f ecosystem.config.cjs
            npm ci --omit=dev
            pm2 --version
            pm2 startOrRestart ecosystem.config.cjs --only tutoring-management-api --update-env
            pm2 save
            curl --fail --silent --show-error http://127.0.0.1:3000/health
