name: Deploy Node.js API to Azure VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy code and restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Navigate to your app directory on the VPS (adjust path as needed)
            cd /home/mo/Tutoring-management-system/backend

            # Pull latest changes from main branch
            git pull origin main

            # Install dependencies and build if needed
            npm install --production

            # Restart the application using PM2 (change app name to match yours)
            pm2 restart my-node-api || pm2 start server.js --name "my-node-api"
