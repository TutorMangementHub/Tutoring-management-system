name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/tutoring-hub-frontEnd/**'
      - '.github/workflows/FrontDeploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/tutoring-hub-frontEnd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/tutoring-hub-frontEnd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production --base-href "/Tutoring-management-system/"

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/tutoring-hub-frontEnd/browser/index.html dist/tutoring-hub-frontEnd/browser/404.html
          touch dist/tutoring-hub-frontEnd/browser/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # `uses:` steps ignore `defaults.run.working-directory`, so this path
          # is resolved from the repository root.
          path: frontend/tutoring-hub-frontEnd/dist/tutoring-hub-frontEnd/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
