<main class="min-h-screen bg-[#f7f8fc] px-5 py-10 text-slate-100">
  <section class="mx-auto mt-8 w-full max-w-[430px] rounded-2xl bg-[#20242d] p-8 shadow-2xl sm:p-10">
    <div class="mb-7 flex h-14 w-14 items-center justify-center rounded-xl bg-[#1677ff] shadow-lg shadow-blue-500/25">
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
    </div>
    <h1 class="text-3xl font-bold tracking-tight">Welcome back</h1>
    <p class="mt-2 text-sm text-slate-400">Log in to continue to your tutoring hub.</p>

    <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block text-sm font-medium text-slate-200">Email
        <input class="mt-2 w-full rounded-lg border border-slate-600 bg-[#2b303a] px-4 py-3 text-white outline-none transition placeholder:text-slate-500 focus:border-[#1677ff]" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <label class="block text-sm font-medium text-slate-200">Password
        <span class="relative mt-2 block">
          <input class="w-full rounded-lg border border-slate-600 bg-[#2b303a] px-4 py-3 pr-16 text-white outline-none transition placeholder:text-slate-500 focus:border-[#1677ff]" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="Your password" autocomplete="current-password" />
          <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-[#62a0ff]" (click)="showPassword.update((value) => !value)">{{ showPassword() ? 'Hide' : 'Show' }}</button>
        </span>
      </label>
      @if (errorMessage()) { <p class="text-sm text-red-400">{{ errorMessage() }}</p> }
      <button class="w-full rounded-lg bg-[#1677ff] py-3.5 font-semibold text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-60" type="submit" [disabled]="submitting()">{{ submitting() ? 'Logging in...' : 'Log in' }}</button>
    </form>
    <p class="mt-7 text-center text-sm text-slate-400">Don't have an account? <a routerLink="/register" class="font-semibold text-[#62a0ff] hover:text-white">Sign up</a></p>
  </section>
</main>
