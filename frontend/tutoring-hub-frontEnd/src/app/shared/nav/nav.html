@if (user(); as currentUser) {
  <aside class="sticky top-0 flex h-screen w-60 shrink-0 flex-col border-r border-white/10 bg-[#0d0d0f] p-5">
    <p class="text-lg font-bold">Tutor Hub</p>
    <nav class="mt-8 space-y-1">
      <a
        routerLink="/"
        routerLinkActive="bg-[#1677ff]/15 font-medium text-[#3d8bff]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block rounded-lg px-3 py-2.5 text-slate-300 hover:bg-white/5 hover:text-white"
      >
        Home
      </a>
      <a
        routerLink="/schedule"
        routerLinkActive="bg-[#1677ff]/15 font-medium text-[#3d8bff]"
        class="block rounded-lg px-3 py-2.5 text-slate-300 hover:bg-white/5 hover:text-white"
      >
        Calendar
      </a>
    </nav>

    <div class="mt-auto">
      <p class="font-semibold">{{ currentUser.fullName }}</p>
      <p class="text-xs text-slate-400">{{ currentUser.email }}</p>
      <button
        type="button"
        class="mt-3 text-sm text-slate-300 hover:text-white"
        (click)="logout()"
      >
        Log out
      </button>
    </div>
  </aside>
}
